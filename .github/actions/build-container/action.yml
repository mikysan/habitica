name: Container
description: Action for building the containers for a given release version
inputs:
  version:
    required: true
    description: "The version tag for which the containers should be built"
  registry_user:
    required: true
    description: "User name for the container registry"
  registry_token:
    required: true
    description: "Access token for the container registry"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        ref: 'releases/${{ inputs.version }}'
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Build and Push Server
      uses: docker/build-push-action@v6
      with:
        target: server
        platforms: linux/amd64
        push: true
        tags: ${{ inputs.registry_user }}/habitica-server:latest,${{ inputs.registry_user }}/habitica-server:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max
    - name: Build and Push Web
      uses: docker/build-push-action@v6
      with:
        target: client
        platforms: linux/amd64
        push: true
        tags: ${{ inputs.registry_user }}/habitica-client:latest,${{ inputs.registry_user }}/habitica-client:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max