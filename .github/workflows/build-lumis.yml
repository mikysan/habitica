# Build dell'immagine server di Habitica per l'istanza self-hosted lumis.uk.
#
# Sostituisce il workflow "Container Build" di awinterstein, che pubblica su Docker Hub
# con credenziali sue. Qui si pubblica su GHCR usando il GITHUB_TOKEN del repository:
# nessun secret da configurare.
#
# Viene costruito solo il target "server": il server serve anche il client web, quindi
# l'immagine "client" non serve a questa istanza. Solo linux/amd64 (il media server e'
# un ThinkCentre M93p): niente QEMU, niente build arm64 da mezz'ora.
name: Build Lumis Image

on:
  push:
    branches: [lumis]
    paths-ignore: ['**.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-lumis
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/habitica-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:lumis
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Riepilogo
        run: |
          {
            echo "### Immagine pubblicata"
            echo
            echo '```'
            echo "${IMAGE}:lumis"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
