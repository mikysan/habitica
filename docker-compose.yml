version: "3"
services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: server
    depends_on:
      - mongo
    environment:
      - NODE_DB_URI=mongodb://mongo/habitica # this only needs to be adapted if using a separate database
      - BASE_URL=http://127.0.0.1:8080 # change this to the URL under which your instance will be reachable
      - INVITE_ONLY=false # change to `true` after registration of initial users, to restrict further registrations
    networks:
      - habitica
    ports:
      - "3000:3000"
  mongo:
    image: docker.io/mongo:latest # better to replace 'latest' with the concrete mongo version you want to use
    restart: unless-stopped
    command: ["--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    volumes:
      - ./mongodb-data/db:/data/db:rw,Z
      - ./mongodb-data/dbconf:/data/configdb:Z
    networks:
      habitica:
        aliases:
          - mongo
networks:
  habitica:
    driver: bridge
